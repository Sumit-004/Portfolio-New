<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namaste</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; }
        body { background: rgb(9, 3, 28); }

        #intro {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgb(9, 3, 28);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        #intro.hide { opacity: 0; visibility: hidden; }

        /* Namaste: starts big in the centre, then slides up */
        #namaste {
            font-family: 'Tiro Devanagari Hindi', serif;
            color: #fff;
            font-size: clamp(4rem, 18vw, 12rem);
            line-height: 1.1;
            opacity: 0;
            transform: translateY(0) scale(1);
            transition: transform 1.1s cubic-bezier(.7, 0, .2, 1), opacity 1s ease;
        }
        #namaste.show { opacity: 1; }
        #namaste.up { transform: translateY(-60vh); opacity: 0; }

        #loaderWrap {
            position: absolute;
            top: 55%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        #loaderWrap.show { opacity: 1; }

        section.bars {
            display: flex;
            gap: 4px;
            width: 120px;
            height: 40px;
            align-items: center;
        }

        .loader {
            height: 20px;
            background: #fff;
            flex: 1;
            transform: scaleY(0.1);
            animation: loading 0.5s ease-in-out infinite alternate;
        }

        @keyframes loading {
            0%   { opacity: 0.2; transform: scaleY(0.1); }
            100% { opacity: 1; transform: scaleY(2); background: #de1fd1; }
        }

        .L-1 { animation-delay: 0.1s; }
        .L-2 { animation-delay: 0.2s; }
        .L-3 { animation-delay: 0.3s; }
        .L-4 { animation-delay: 0.4s; }

        #percent {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            font-variant-numeric: tabular-nums;
            font-family: system-ui, sans-serif;
        }

        /* ---------- Main site ---------- */
        #site { opacity: 0; transition: opacity 0.8s ease; }
        #site.show { opacity: 1; }

        @media (prefers-reduced-motion: reduce) {
            .loader { animation-duration: 1.2s; }
            #namaste { transition: opacity 0.3s; }
        }
    </style>
</head>

<body>

    <!-- ===== INTRO ===== -->
    <div id="intro">
        <h1 id="namaste">नमस्ते</h1>

        <div id="loaderWrap">
            <section class="bars">
                <span class="loader L-1"></span>
                <span class="loader L-2"></span>
                <span class="loader L-3"></span>
                <span class="loader L-4"></span>
            </section>
            <div id="percent">0%</div>
        </div>
    </div>

    <main id="site" class="min-h-screen text-white flex items-center justify-center">
        <div class="text-center px-6">
            <h2 class="text-4xl md:text-6xl font-bold mb-4">Welcome to my website</h2>
            <p class="text-lg text-gray-300">Put your Tailwind CSS page content here.</p>
        </div>
    </main>

    <script>
        const namaste = document.getElementById('namaste');
        const loaderWrap = document.getElementById('loaderWrap');
        const percent = document.getElementById('percent');
        const intro = document.getElementById('intro');
        const site = document.getElementById('site');

        // Keep the page from scrolling while the intro plays
        document.body.style.overflow = 'hidden';

        // 1) Show Namaste big in the centre
        setTimeout(() => namaste.classList.add('show'), 200);

        // 2) After 1.8s, move it up
        setTimeout(() => namaste.classList.add('up'), 1800);

        // 3) Show the bars + start counting 0 -> 100
        setTimeout(() => {
            loaderWrap.classList.add('show');
            startCounting(2500); // duration in ms
        }, 2600);

        function startCounting(duration) {
            const start = performance.now();
            function tick(now) {
                const progress = Math.min((now - start) / duration, 1);
                percent.textContent = Math.floor(progress * 100) + '%';
                if (progress < 1) {
                    requestAnimationFrame(tick);
                } else {
                    percent.textContent = '100%';
                    setTimeout(revealSite, 500);
                }
            }
            requestAnimationFrame(tick);
        }

        // 4) Fade out intro, show the site
        function revealSite() {
            intro.classList.add('hide');
            site.classList.add('show');
            document.body.style.overflow = '';
            setTimeout(() => intro.remove(), 900);
        }
    </script>
</body>

</html>
